    <path d="M67 54c2-27 22-40 53-40s51 13 53 40l-14-4c-5-10-19-15-39-15s-34 5-39 15z" fill="#91BCDD"/>
    <path d="M70 52c21-9 79-9 100 0l-4 9c-21-7-71-7-92 0z" fill="#D45B92"/>
    <path d="m104 40 16-8 16 8-4 16-12 9-12-9z" fill="#fff"/>
    <path d="M118 43h4v5h5v4h-5v5h-4v-5h-5v-4h5z" fill="#D45B92"/>
    <path d="m106 157 14 9 14-9 5 19-19 12-19-12z" fill="#fff"/>
    <path d="M118 166h4v5h5v4h-5v5h-4v-5h-5v-4h5z" fill="#6D739B"/>
    <path d="m180 149 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#91BCDD"/>
  </g>
  <text x="120" y="250" text-anchor="middle" fill="#D45B92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="3">KAYA</text>
  <text x="120" y="270" text-anchor="middle" fill="#6D739B" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">HANDA SAFETY COMPANION</text>
