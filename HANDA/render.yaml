services:
  - type: web
    name: handa-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./HANDA/backend/Dockerfile
    dockerContext: ./HANDA/backend
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: REALTIME_JWT_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:19006,https://handa-admin-web.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: "^(?:https?://(?:localhost|127\\.0\\.0\\.1|192\\.168\\.\\d+\\.\\d+)(?::\\d+)?|https://handa-(?:mobile-web|admin-web)(?:-[a-z0-9-]+)?\\.vercel\\.app|https://handa-(?:mobile-web|admin-web)\\.onrender\\.com)$"

  - type: web
    name: handa-mobile-web
    runtime: static
    buildCommand: cd HANDA && npm ci && npm run web:export
    staticPublishPath: ./HANDA/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://handa-api.onrender.com
      - key: EXPO_PUBLIC_MAPBOX_TOKEN
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: handa-admin-web
    runtime: static
    buildCommand: cd HANDA && npm ci && npm run admin:build
    staticPublishPath: ./HANDA/admin-web/dist
    envVars:
      - key: VITE_API_URL
        value: https://handa-api.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html